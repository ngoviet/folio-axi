packages:
  - "."

trustPolicy: no-downgrade
blockExoticSubdeps: true
# @excalidraw/excalidraw 0.18.1 depends on mermaid-to-excalidraw 2.2.2 for its own
# Mermaid paste and text-to-diagram dialog, and 2.2.2 pulls in mermaid 11.12.1
# (CVE-2026-41150, CVE-2026-41159). Point it at the converter the whiteboard pins
# (3.x, parsed by Pele, no mermaid) so mermaid leaves the bundle. It calls only
# parseMermaidToExcalidraw(text) and reads { elements, files }, which 3.x keeps.
# Keep this equal to the devDependency: test/whiteboard-pins.test.js checks that
# Excalidraw resolves the pinned converter.
overrides:
  "@excalidraw/excalidraw>@excalidraw/mermaid-to-excalidraw": 3.6.0
  # nanoid 3.3.3 (via Excalidraw) has 3 high advisories fixed in >=3.3.18; stay in 3.x.
  # nanoid 4.0.2 (via mermaid-to-excalidraw) is only fixed in 5.x: left alone (major bump).
  "nanoid@3": ^6.0.0
minimumReleaseAge: 10080
minimumReleaseAgeStrict: true
minimumReleaseAgeExclude:
  - axi-sdk-js
  - folio-axi
onlyBuiltDependencies:
  - esbuild
allowBuilds:
  esbuild: true
