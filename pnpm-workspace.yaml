packages:
  - "."

trustPolicy: no-downgrade
# langium@3.3.1 (pinned exactly by @mermaid-js/parser 0.6.3, via mermaid 11.12 and
# mermaid-to-excalidraw 2.x) has no provenance while langium@3.0.0 did. Checked on the
# npm registry 2026-11-09: same publisher (msujew) since 3.1.0, released 2025-01-23,
# gitHead ef7ff4e matches the upstream "Release 3.3.1" commit, so not a takeover.
# Remove once mermaid >= 11.16 and mermaid-to-excalidraw 3.x drop parser 0.6.x.
trustPolicyExclude:
  - langium@3.3.1
blockExoticSubdeps: true
minimumReleaseAge: 10080
minimumReleaseAgeStrict: true
minimumReleaseAgeExclude:
  - axi-sdk-js
  - folio-axi
  # Renovate security update: esbuild@0.28.1
  - esbuild@0.28.1
onlyBuiltDependencies:
  - esbuild
allowBuilds:
  esbuild: true
